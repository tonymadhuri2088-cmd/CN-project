[project]
name = "netwing"
version = "0.1.0"
description = "NetWing: evidence-sufficiency controller for LLM network-diagnosis agents"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

readme = "README.md"
license = { text = "MIT" }
keywords = ["networking", "llm", "agents", "diagnosis", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://netwing-demo.onrender.com"
Repository = "https://github.com/tonymadhuri2088-cmd/CN-project"
Issues = "https://github.com/tonymadhuri2088-cmd/CN-project/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis"]
lint = ["ruff"]
typecheck = ["mypy"]

[project.scripts]
netwing = "netwing.demo:main"
netwing-ui = "netwing.webui:main"
netwing-reproduce = "netwing.reproduce:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netwing"]

[tool.setuptools.package-data]
netwing = ["pricing.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
ignore_missing_imports = true
files = ["netwing"]
