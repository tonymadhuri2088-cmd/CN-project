[project]
name = "netwing"
version = "0.1.0"
description = "NetWing: evidence-sufficiency controller for LLM network-diagnosis agents"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netwing"]

[tool.setuptools.package-data]
netwing = ["pricing.json"]
