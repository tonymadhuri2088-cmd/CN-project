[project]
name = "netwing"
version = "0.1.0"
description = "NetWing: evidence-sufficiency controller for LLM network-diagnosis agents"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40"]

readme = "README.md"
license = { text = "All rights reserved (course project; licence to be chosen by the authors)" }
keywords = ["networking", "llm", "agents", "diagnosis", "evaluation"]

[project.optional-dependencies]
dev = ["pytest"]
lint = ["ruff"]
typecheck = ["mypy"]

[project.scripts]
netwing = "netwing.demo:main"
netwing-ui = "netwing.webui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["netwing"]

[tool.setuptools.package-data]
netwing = ["pricing.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.mypy]
ignore_missing_imports = true
files = ["netwing"]
