# Fly.io config for the read-only demo (fly launch --copy-config, then fly deploy).
app = "netwing-demo"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NETWING_READONLY = "1"
  PORT = "8765"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "40s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
