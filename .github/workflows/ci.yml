name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,lint]"
      - name: Lint
        run: ruff check netwing tests
      - name: Tests (no API key, no network lab)
        run: python -m pytest -q
      - name: Dry run of the whole pipeline (stub client, zero API spend)
        run: python -m netwing.demo --dry-run --suite easy --repeats 1 --out /tmp/ci-run.jsonl
