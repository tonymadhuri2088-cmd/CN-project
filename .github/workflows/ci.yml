name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,lint,typecheck]"
      - name: Lint
        run: ruff check netwing tests
      - name: Type check
        run: mypy
      - name: Tests (no API key, no network lab)
        run: python -m pytest -q
      - name: Every documented number reproduces from the raw logs
        run: python -m netwing.reproduce check --strict
      - name: Dry run of the whole pipeline (stub client, zero API spend)
        run: python -m netwing.demo --dry-run --suite easy --repeats 1 --out /tmp/ci-run.jsonl

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the web UI image
        run: docker build -t netwing-ui .
      - name: "Smoke test - the UI answers from inside the container"
        run: |
          docker run -d --name ui -p 8765:8765 netwing-ui
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/lab > /dev/null; then echo "UI is up"; exit 0; fi
            sleep 1
          done
          docker logs ui
          exit 1
